// android/build.gradle
buildscript {
    ext {
        // Pins for Gradle 8.13 compatibility
        agp_version    = '8.5.2'   // Required for Gradle 8.13
        kotlin_version = '2.0.21'  // Matches your gradlew -version
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NO nitrous/nitrous-gradle-plugin here – it's not needed for Nitro
    }
}

// React-Native Android dir discovery (unchanged from your original)
def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Expo / React-Native root-project plugins (unchanged)
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"